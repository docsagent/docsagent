[project]
name = "docsagent-mcp-zotero"
version = "5.0.0"
description = "DocsAgent - give AI agents instant, private access to your personal knowledge base. Zotero MCP server (Python) over a resident native C++ search engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vincent" }]
keywords = ["mcp", "model-context-protocol", "mcp-server", "ai-agents", "local-ai", "llm", "claude", "cursor", "zotero", "semantic-search", "full-text-search", "bm25", "pdf-search", "knowledge-base", "local-first", "rag", "reference-manager", "research"]
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "mcp>=2.2,<2.3",
  "jsonschema>=4.18",
]

[project.scripts]
docsagent-mcp-zotero = "docsagent_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/docsagent/docsagent"
Repository = "https://github.com/docsagent/docsagent"
Issues = "https://github.com/docsagent/docsagent/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docsagent_mcp*"]

[tool.setuptools.package-data]
docsagent_mcp = ["spec/tools/*.json", "spec/*.json", "bin/*"]
